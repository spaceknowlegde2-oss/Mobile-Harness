name: Build unlocked APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleOnlineDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-unlocked-online
          path: app/build/outputs/apk/online/debug/*.apk
